server:
  port: 8081

spring:
  application:
    name: user-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Mọi instance user-service cùng group-id -> Kafka coi là 1 "đội",
      # tự chia partition cho từng instance (load balancing), KHÔNG phát
      # trùng 1 message cho 2 instance trong cùng group.
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.userservice.event"
