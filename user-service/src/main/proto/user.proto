syntax = "proto3";

package user;

option java_package = "com.example.grpcdemo.user";
option java_multiple_files = true;

// Service quản lý user - chạy độc lập, expose ở gRPC port 9091
service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  int32 user_id = 1;
}

message GetUserResponse {
  int32 user_id = 1;
  string name = 2;
  string email = 3;
  bool found = 4;
}
